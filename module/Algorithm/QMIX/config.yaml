# PyMARL QMIX defaults adapted to this repository's SMAC runner.
gamma: 0.99
learning_rate: 0.0005
optim_alpha: 0.99
optim_eps: 0.00001
grad_norm_clip: 10.0

buffer_size: 5000
batch_size: 32
train_updates_per_episode: 1
target_update_interval: 200
double_q: true

rnn_hidden_dim: 64
mixing_embed_dim: 32
hypernet_layers: 2
hypernet_embed: 64

obs_last_action: true
obs_agent_id: true
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000
